<text x="778.8000000000001" y="877.1" class="label" text-anchor="middle">MÓDULO A · 9 × 15 u</text>
<text x="778.8000000000001" y="900.2" class="note" text-anchor="middle">Novos departamentos</text>
<text x="778.8000000000001" y="507.5" class="label" text-anchor="middle">MÓDULO B · 9 × 11,2 u</text>
<text x="778.8000000000001" y="532.7" class="note" text-anchor="middle">Ligação com A e com o anexo</text>
<text x="526.8" y="196.7" class="label" text-anchor="middle">MÓDULO C · 12 × 11,2 u</text>
<text x="526.8" y="224" class="note" text-anchor="middle">Expansão posterior</text>
<text x="320.4" y="851.9" class="label" text-anchor="middle">NÚCLEO ATUAL · N1–15</text>
<text x="320.4" y="879.2" class="note" text-anchor="middle">Entrada, escritório e caixa estáveis</text>
<text x="260.4" y="557.9" class="label" text-anchor="middle">FAZENDA E OFICINAS</text>
<text x="260.4" y="585.2" class="note" text-anchor="middle">Permanecem a oeste</text>
<text x="1020" y="180" class="label">REGRAS DE CRESCIMENTO</text>
<text x="1020" y="218" class="note">1. Corredor antes dos móveis.</text>
<text x="1020" y="254" class="note">2. Ilhas frias sem parede de apoio.</text>
<text x="1020" y="290" class="note">3. Fechamentos removíveis.</text>
<text x="1020" y="326" class="note">4. Novos módulos de 3 u de largura.</text>
<text x="1020" y="362" class="note">5. Ampliar por compras futuras.</text>
<text x="1020" y="398" class="note">6. Repetir conexões nas novas bordas.</text>
<text x="1020" y="480" class="label">TERRENO TAMBÉM CRESCE</text>
<text x="1020" y="513" class="note">A e B ultrapassam o limite x atual.</text>
<text x="1020" y="539" class="note">C ultrapassa o limite z atual.</text>
<text x="1020" y="579" class="note">Exigem ampliar terreno, câmera,</text>
<text x="1020" y="605" class="note">calçada, navegação e salvamento.</text>
<text x="42" y="1053" class="sub">Verde claro = reserva futura · Roxo = painel removível · Azul = corredor reservado · Escala horizontal 24 px/u · vertical 21 px/u</text></svg>