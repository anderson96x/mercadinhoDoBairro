<text x="734.8000000000001" y="860.5999999999999" class="label" text-anchor="middle">MÓDULO A · 9 × 12,7 u</text>
<text x="734.8000000000001" y="887" class="note" text-anchor="middle">Novos departamentos</text>
<text x="734.8000000000001" y="438.20000000000005" class="label" text-anchor="middle">MÓDULO B · 9 × 9,5 u</text>
<text x="734.8000000000001" y="467" class="note" text-anchor="middle">Ligação com A e com o anexo</text>
<text x="518.8" y="203" class="label" text-anchor="middle">MÓDULO C · 9 × 9,5 u</text>
<text x="518.8" y="229.40000000000003" class="note" text-anchor="middle">Expansão posterior</text>
<text x="348.4" y="831.8" class="label" text-anchor="middle">NÚCLEO ATUAL · N1–15</text>
<text x="348.4" y="863" class="note" text-anchor="middle">Entrada, escritório e caixa estáveis</text>
<text x="288.4" y="495.79999999999995" class="label" text-anchor="middle">FAZENDA E OFICINAS</text>
<text x="288.4" y="527" class="note" text-anchor="middle">Permanecem a oeste</text>
<text x="1020" y="180" class="label">REGRAS DE CRESCIMENTO</text>
<text x="1020" y="218" class="note">1. Corredor antes dos móveis.</text>
<text x="1020" y="254" class="note">2. Ilhas frias sem parede de apoio.</text>
<text x="1020" y="290" class="note">3. Fechamentos removíveis.</text>
<text x="1020" y="326" class="note">4. Novos módulos de 3 u de largura.</text>
<text x="1020" y="362" class="note">5. Ampliar por compras futuras.</text>
<text x="1020" y="398" class="note">6. Repetir conexões nas novas bordas.</text>
<text x="1020" y="480" class="label">TERRENO TAMBÉM CRESCE</text>
<text x="1020" y="513" class="note">A e B ultrapassam o limite x atual.</text>
<text x="1020" y="539" class="note">C ultrapassa o limite z atual.</text>
<text x="1020" y="579" class="note">Exigem ampliar terreno, câmera,</text>
<text x="1020" y="605" class="note">calçada, navegação e salvamento.</text>
<text x="42" y="953" class="sub">Verde claro = reserva futura · Roxo = painel removível · Azul = corredor reservado · Escala 24 px/u</text></svg>