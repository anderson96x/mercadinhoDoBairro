<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260" role="img" aria-labelledby="title desc">
<title id="title">Mercadinho do Bairro — nova planta conceitual</title>
<desc id="desc">Planta em vista superior na escala de 25 pixels por unidade do jogo. Preserva o salão principal e o anexo artesanal em L. Mostra dez produtos, escritório, fila de dez posições, entrada e saída compartilhadas, produção agrícola e rotas de clientes e reposição.</desc>
