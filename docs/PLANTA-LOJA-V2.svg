<text x="1110" y="202" class="eyebrow" >O QUE MUDA</text>
<text x="1110" y="250" class="eyebrow" >01</text>
<text x="1110" y="275" class="label" >Uma leitura simples</text>
<text x="1110" y="301" class="note" >Hortifruti no primeiro salão.</text>
<text x="1110" y="321" class="note" >Laticínios na parede direita.</text>
<text x="1110" y="341" class="note" >Artesanais no anexo ao fundo.</text>
<text x="1110" y="383" class="eyebrow" >02</text>
<text x="1110" y="408" class="label" >Um percurso contínuo</text>
<text x="1110" y="434" class="note" >Dois corredores conectam o</text>
<text x="1110" y="454" class="note" >anexo: o cliente entra, explora</text>
<text x="1110" y="474" class="note" >e retorna sem um beco sem saída.</text>
<text x="1110" y="516" class="eyebrow" >03</text>
<text x="1110" y="541" class="label" >Uma frente organizada</text>
<text x="1110" y="567" class="note" >Cestas fora do vão da porta.</text>
<text x="1110" y="587" class="note" >Fila em faixa própria; caixa</text>
<text x="1110" y="607" class="note" >próximo à entrada e à saída.</text>
<text x="1110" y="649" class="eyebrow" >04</text>
<text x="1110" y="674" class="label" >Reposição mais legível</text>
<text x="1110" y="700" class="note" >Espinha de serviço na fazenda,</text>
<text x="1110" y="720" class="note" >faixa de fundo e acesso lateral.</text>
<text x="1110" y="740" class="note" >Trechos de venda são compartilhados.</text>
<text x="1110" y="782" class="eyebrow" >05</text>
<text x="1110" y="807" class="label" >O mesmo caráter</text>
<text x="1110" y="833" class="note" >Madeira clara, piso creme,</text>
<text x="1110" y="853" class="note" >verde profundo e paredes baixas</text>
<text x="1110" y="873" class="note" >para preservar a vista do jogo.</text>
<text x="1110" y="962" class="eyebrow" >ESQUEMA PARA O JOGO</text>
<text x="1110" y="987" class="note" >u = unidade de coordenada.</text>
<text x="1110" y="1009" class="note" >Sem conversão para metros.</text>
<text x="1110" y="1031" class="note" >Orientação: rua em +z.</text>
<text x="66" y="1072" class="eyebrow" >LEGENDA</text>
