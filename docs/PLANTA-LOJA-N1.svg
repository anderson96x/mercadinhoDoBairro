<title id="title">Nova planta — nível 1</title><desc id="desc">Terreno quadrado, salão de 14 por 16 unidades, escritório ao fundo, banca modular de hortifruti, caixa frontal e porta posterior para os canteiros. Somente tomate disponível.</desc>
