<title id="title">Nova planta — nível 18</title><desc id="desc">Terreno ampliado nos fundos, salão de 24 por 22 unidades, banca modular de hortifruti, caixa frontal e porta posterior para os canteiros. Milho alinhado atrás do tomate, ambos inteiramente atrás da loja.</desc>
