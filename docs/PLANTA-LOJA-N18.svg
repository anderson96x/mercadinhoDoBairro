<text x="885" y="165" class="label">IMPLEMENTADO NO NÍVEL 18</text>
<text x="885" y="196" class="note">Salão ampliado: 24 × 22 u.</text>
<text x="885" y="227" class="note">Terreno: 40 × 46 u.</text>
<text x="885" y="258" class="note">Tomate, milho e trigo na banca.</text>
<text x="885" y="289" class="note">Ovos + leite na parede do fundo.</text>
<text x="885" y="320" class="note">Entrada frontal e acesso posterior.</text>
<text x="885" y="351" class="note">Caixa com acesso livre à cadeira.</text>
<text x="885" y="382" class="note">P1 e P2: prateleiras vazias.</text>
<text x="885" y="413" class="note"></text>
<text x="885" y="444" class="label">BANCA MODULAR</text>
<text x="885" y="475" class="note">Só tomates aparecem no início.</text>
<text x="885" y="506" class="note">Milho, trigo e morango acrescentam</text>
<text x="885" y="537" class="note">seções após as respectivas compras.</text>
<text x="885" y="568" class="note">Estoques e alvos são independentes.</text>
<text x="885" y="599" class="note">Pontilhado: reserva neste desenho,</text>
<text x="885" y="630" class="note">sem móvel ou colisão no jogo.</text>
<text x="885" y="661" class="note"></text>
<text x="885" y="692" class="label">ESCOPO DESTA ETAPA</text>
<text x="885" y="723" class="note">N18: expansão de R$ 10.000.</text>
<text x="885" y="754" class="note">Pátio de carga exclusivo à esquerda.</text>
<text x="885" y="785" class="note">N9: padaria voltada ao hortifruti.</text>
<text x="885" y="816" class="note">u = unidade do jogo; rua em +z.</text>
<text x="48" y="966" class="small">Gerado da configuração do jogo · Traço laranja: percurso de produção · Círculos: posições de fila apenas na documentação</text></svg>