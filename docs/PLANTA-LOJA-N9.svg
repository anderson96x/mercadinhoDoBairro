<title id="title">Nova planta — nível 9</title><desc id="desc">Terreno quadrado, salão de 24 por 16 unidades, banca modular de hortifruti, caixa frontal e porta posterior para os canteiros. Milho alinhado atrás do tomate, ambos inteiramente atrás da loja.</desc>
